<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>✈ FLY</title>
  <style>
    /* ── CSS variables ─────────────────────────────── */
    :root {
      --bg:        #1e2a3d;
      --bg-top:    #1b2536;
      --panel:     #2b3c59;
      --panel-2:   #32466b;
      --panel-3:   #3a5078;
      --line:      #4a5c79;
      --line-soft: #3d4f6b;
      --text:      #e3e9f2;
      --muted:     #b2bfd1;
      --dim:       #8596ad;
      --accent:    #4784c7;
      --accent-2:  #5d9ad6;
      --danger:    #b85c5c;
      --nav-h:     58px;
      --safe-b:    env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { height: 100%; }
    body {
      height: 100%; background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text); display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(var(--nav-h) + var(--safe-b));
    }

    /* ── Header ────────────────────────────────────── */
    .ios-header {
      display: flex; align-items: center;
      padding: 8px 10px;
      padding-top: calc(8px + env(safe-area-inset-top, 0px));
      background: var(--bg-top);
      border-bottom: 1px solid var(--line);
      gap: 6px; flex-shrink: 0;
    }
    .ios-header h1 {
      font-size: 15px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .4px; flex: 1;
    }
    .ios-header button, .ios-header .file-button {
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      padding: 6px 9px; font-size: 11px; cursor: pointer; white-space: nowrap;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .ios-header .file-button { display: inline-flex; align-items: center; }
    .ios-header .file-button input { display: none; }
    #saveData.dirty { border-color: var(--accent-2); color: #fff; box-shadow: inset 0 0 0 1px var(--accent-2); }

    /* ── Stat chips: scrollable horizontal strip ──── */
    #statCards {
      display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; background: var(--bg-top);
      border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    #statCards::-webkit-scrollbar { display: none; }
    .stat-chip {
      flex-shrink: 0; text-align: center;
      padding: 8px 18px; border: 0; border-right: 1px solid var(--line);
      background: transparent; color: inherit; font: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .stat-chip:last-child { border-right: none; }
    .stat-chip strong { display: block; font-size: 22px; font-weight: 700; line-height: 1.1; }
    .stat-chip span { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; }
    .stat-chip.clickable { cursor: pointer; }
    .stat-chip.clickable:active { background: var(--panel); }

    /* ── Main / panels ─────────────────────────────── */
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .panel.active { display: flex; }

    /* ── Year pills ────────────────────────────────── */
    .year-pills-wrap {
      display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 10px 12px; scrollbar-width: none; flex-shrink: 0;
      border-bottom: 1px solid var(--line-soft);
    }
    .year-pills-wrap::-webkit-scrollbar { display: none; }
    .year-pill {
      flex-shrink: 0; padding: 6px 16px; border: 1px solid var(--line);
      background: var(--panel); color: var(--muted); font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap; border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .year-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Flight cards ──────────────────────────────── */
    .flight-cards {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .flight-card {
      background: var(--panel); border: 1px solid var(--line);
      padding: 12px 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, border-color .15s;
    }
    .flight-card:active { background: var(--panel-2); }
    .flight-card.editing {
      background: rgba(71,132,199,.22);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px rgba(71,132,199,.18);
    }
    .fc-route {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 700; margin-bottom: 5px;
    }
    .fc-arrow { color: var(--accent-2); font-size: 15px; font-weight: 400; }
    .fc-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 3px; }
    .fc-meta span { font-size: 12px; color: var(--muted); }
    .fc-meta strong { color: var(--text); font-weight: 600; }
    .fc-airport { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .no-flights { padding: 24px 14px; color: var(--dim); font-size: 13px; text-align: center; }
    .detail-back { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
    .detail-back:active { background: var(--panel-2); }
    .flight-detail { background: var(--panel); border: 1px solid var(--line); padding: 14px; }
    .detail-route { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .detail-item { border-top: 1px solid var(--line-soft); padding-top: 8px; }
    .detail-label { display: block; color: var(--dim); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
    .detail-value { display: block; margin-top: 3px; font-size: 14px; }

    /* ── Entry tab: search bar ─────────────────────── */
    .search-bar-wrap {
      padding: 10px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .search-bar-wrap input {
      width: 100%; background: var(--bg-top); border: 1px solid var(--line);
      padding: 9px 12px; font: inherit; font-size: 14px; color: var(--text); outline: none;
    }
    .search-bar-wrap input:focus { border-color: var(--accent); }

    /* ── Aggregate views (airports / countries / airlines) ── */
    .agg-list {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .agg-card {
      display: flex; align-items: center; gap: 10px; width: 100%;
      text-align: left; background: var(--panel); border: 1px solid var(--line);
      color: var(--text); font: inherit; padding: 11px 13px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .agg-card:active { background: var(--panel-2); }
    .agg-main { flex: 1; min-width: 0; display: block; }
    .agg-title { display: block; font-size: 15px; font-weight: 700; }
    .agg-code { color: var(--accent-2); margin-right: 4px; }
    .agg-sub {
      display: block; font-size: 11px; color: var(--muted); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .agg-count { font-size: 22px; font-weight: 700; color: var(--accent-2); flex-shrink: 0; }
    .agg-detail-head { background: var(--panel); border: 1px solid var(--line); padding: 13px; margin-bottom: 8px; }
    .agg-detail-title { font-size: 18px; font-weight: 700; }
    .agg-detail-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .detail-stats { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .detail-stat { background: var(--bg-top); border: 1px solid var(--line); padding: 3px 8px; font-size: 11px; color: var(--muted); }
    .detail-stat strong { color: var(--accent-2); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .airport-chip, .aircraft-chip {
      background: var(--bg-top); border: 1px solid var(--line); color: var(--muted);
      padding: 3px 8px; font: inherit; font-size: 11px;
    }
    .airport-chip { cursor: pointer; }
    .airport-chip strong, .aircraft-chip strong { color: var(--accent-2); margin-left: 3px; }
    .breakdown-year {
      font-size: 10px; font-weight: 700; color: var(--accent-2); letter-spacing: .6px;
      padding: 9px 2px 2px; text-transform: uppercase;
    }
    .breakdown-card {
      display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left;
      background: var(--panel); border: 1px solid var(--line); color: var(--text);
      font: inherit; padding: 10px 13px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .breakdown-card:active { background: var(--panel-2); }
    .bc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .bc-date { font-size: 11px; color: var(--muted); font-weight: 600; }
    .bc-route { font-size: 18px; font-weight: 700; }
    .bc-meta { font-size: 12px; color: var(--text); }
    .bc-sub { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dir-badge {
      display: inline-block; padding: 1px 7px; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px; border: 1px solid;
    }
    .dir-badge.dep { color: #f0d6a8; border-color: #8a6d3b; background: rgba(240,214,168,.08); }
    .dir-badge.arr { color: #a9d8ff; border-color: #3c6f96; background: rgba(169,216,255,.08); }

    /* ── FAB ───────────────────────────────────────── */
    .fab {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
      right: 20px;
      width: 54px; height: 54px;
      background: var(--accent); border: none; color: #fff;
      font-size: 28px; font-weight: 300; cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,.45);
      border-radius: 2px; z-index: 80; display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .fab:active { background: var(--accent-2); }

    /* ── Bottom sheet ──────────────────────────────── */
    .sheet-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); z-index: 88;
    }
    .sheet-backdrop.active { display: block; }

    .form-sheet {
      position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b));
      background: var(--bg); border-top: 2px solid var(--line);
      z-index: 89;
      display: flex; flex-direction: column;
      max-height: var(--sheet-max-h, 92vh);
      height: var(--sheet-max-h, 92vh);
      transform: translateY(100%); transition: transform .25s ease;
    }
    .form-sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: var(--line); margin: 10px auto 4px; flex-shrink: 0;
    }
    .sheet-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; flex-shrink: 0;
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid var(--line);
    }
    .sheet-head button { background: transparent; border: none; color: var(--dim); font-size: 22px; cursor: pointer; padding: 0 2px; }
    .sheet-head button:active { color: var(--text); }

    .sheet-form {
      flex: 1 1 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      min-height: 0;
    }
    .sheet-form .form-group { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
    .sheet-form .form-group label {
      display: block; font-size: 10px; font-weight: 600; color: var(--dim);
      text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px;
    }
    .sheet-form .form-group input {
      width: 100%; background: var(--panel); border: 1px solid var(--line);
      padding: 11px 12px; font: inherit; font-size: 16px; color: var(--text); outline: none;
    }
    .sheet-form .form-group input:focus { border-color: var(--accent); }
    .city-hint { font-size: 11px; color: var(--accent-2); margin-top: 5px; min-height: 1.1em; }

    .sheet-actions {
      display: flex; gap: 8px; padding: 14px 16px;
      flex-shrink: 0;
      border-top: 1px solid var(--line-soft);
      background: var(--bg);
    }
    .sheet-actions button {
      flex: 1; background: var(--accent); border: 1px solid var(--accent);
      color: #fff; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .sheet-actions button.sec { background: var(--panel); border: 1px solid var(--line); color: var(--text); }
    .sheet-actions button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }

    /* ── Bottom nav ────────────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-b));
      background: var(--bg-top); border-top: 1px solid var(--line);
      display: flex; z-index: 100;
      padding-bottom: var(--safe-b);
    }
    .bnav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; border: none; background: transparent; color: var(--dim);
      font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .2px;
      cursor: pointer; border-top: 2px solid transparent; margin-top: -1px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .bnav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .bnav-btn.active { color: var(--accent-2); border-top-color: var(--accent-2); }

    /* ── File status banner ────────────────────────── */
    .file-status {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px;
      padding: 6px 12px; font-size: 12px;
      background: var(--panel-2); color: var(--muted);
      border-bottom: 1px solid var(--line); flex-shrink: 0;
    }
    .file-status.ok { background: #23402f; color: #bfe3c9; }
    .file-status.warn { background: #4a3a22; color: #f0d6a8; }
    .file-status.error { background: #4a2b2b; color: #f0b9b9; }
    .status-text { min-width: 0; }
    .status-actions { display: flex; gap: 5px; }
    .status-actions button {
      background: rgba(0,0,0,.22); border: 1px solid currentColor; color: inherit;
      padding: 2px 8px; font: inherit; font-size: 11px; cursor: pointer;
    }

    /* ── Misc ──────────────────────────────────────── */
    .hidden { display: none !important; }
    .clickable-row { cursor: pointer; }
    #loadingMsg { padding: 20px; color: var(--dim); text-align: center; font-size: 13px; }
  </style>
</head>
<body>

  <!-- Bottom nav -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="bnav-btn active" data-tab="dashboard" aria-label="Flights">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Flights
    </button>
    <button class="bnav-btn" data-tab="airports" aria-label="Airports">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Airports
    </button>
    <button class="bnav-btn" data-tab="countries" aria-label="Countries">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
      Countries
    </button>
    <button class="bnav-btn" data-tab="airlines" aria-label="Airlines">
      <svg viewBox="0 0 24 24"><path d="M21 3L3 10.5l6 2.5 2.5 6L21 3z"/><path d="M9 13l5-5"/></svg>
      Airlines
    </button>
    <button class="bnav-btn" data-tab="entry" aria-label="Data entry">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Entry
    </button>
  </nav>

  <!-- FAB (entry tab, add new flight) -->
  <button class="fab hidden" id="fab" aria-label="Add flight">+</button>

  <!-- Sheet backdrop -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <!-- Bottom sheet: add/edit form -->
  <div class="form-sheet" id="formSheet" role="dialog" aria-label="Flight form">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span id="sheetTitle">Add flight</span>
    </div>
    <form class="sheet-form" id="flightForm">
      <input type="hidden" id="flightId">
      <div class="form-group">
        <label for="sDate">Date</label>
        <input id="sDate" type="date" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="sDep">Departure</label>
        <input id="sDep" maxlength="4" required placeholder="AMS" autocomplete="off" autocapitalize="characters">
      </div>
      <div class="form-group">
        <label for="sArr">Arrival</label>
        <input id="sArr" maxlength="4" required placeholder="PHL" autocomplete="off" autocapitalize="characters">
        <div class="city-hint" id="arrivalCity"></div>
      </div>
      <div class="form-group">
        <label for="sAirline">Airline</label>
        <input id="sAirline" placeholder="KLM" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="sAircraft">Aircraft</label>
        <input id="sAircraft" placeholder="B737" autocomplete="off">
      </div>
    </form>
    <div class="sheet-actions">
      <button type="submit" form="flightForm">Save</button>
      <button type="button" id="deleteFlightBtn" class="danger hidden">Delete</button>
      <button type="button" id="cancelSheet" class="sec">Cancel</button>
    </div>
  </div>

  <!-- Header -->
  <header class="ios-header">
    <h1>✈ FLY</h1>
    <label class="file-button" id="importLabel" title="Import flights or a backup">
      Import <input id="importJson" type="file" accept=".json,.ndjson,.txt,application/json,application/x-ndjson">
    </label>
    <button id="saveData" title="Save data files">Save</button>
    <button id="exportJson" title="Download a combined JSON backup">Export</button>
  </header>

  <!-- Stat chips -->
  <div id="statCards"></div>

  <!-- File status -->
  <div id="fileStatus" class="file-status hidden" role="status" aria-live="polite"></div>

  <main>
    <!-- Dashboard panel -->
    <section id="dashboard" class="panel active">
      <div class="year-pills-wrap" id="yearPills"></div>
      <div class="flight-cards" id="dashCards">
        <p id="loadingMsg">Loading…</p>
      </div>
    </section>

    <!-- Airports panel -->
    <section id="airports" class="panel">
      <div class="search-bar-wrap">
        <input id="airportSearch" type="search" placeholder="Search airport, city, country…" autocomplete="off">
      </div>
      <div class="agg-list" id="airportList"></div>
    </section>

    <!-- Countries panel -->
    <section id="countries" class="panel">
      <div class="search-bar-wrap">
        <input id="countrySearch" type="search" placeholder="Search country or airport…" autocomplete="off">
      </div>
      <div class="agg-list" id="countryList"></div>
    </section>

    <!-- Airlines panel -->
    <section id="airlines" class="panel">
      <div class="search-bar-wrap">
        <input id="airlineSearch" type="search" placeholder="Search airline, aircraft, country…" autocomplete="off">
      </div>
      <div class="agg-list" id="airlineList"></div>
    </section>

    <!-- Entry panel -->
    <section id="entry" class="panel">
      <div class="search-bar-wrap">
        <input id="entrySearch" type="search" placeholder="Search flights…" autocomplete="off">
      </div>
      <div class="flight-cards" id="entryCards"></div>
    </section>
  </main>

  <!-- shared data -->
  <script src="flight-core.js"></script>
  <script src="flight-store.js"></script>
  <script>

  const core = window.FlightCore
  const store = window.FlightStore

  const {
    normCode,
    normText,
    escapeHtml: esc,
    shortAirportName,
    flightYear,
    sortByDateDesc,
    flightsForIds,
  } = core

  const $ = id => document.getElementById(id)

  // ── App state ─────────────────────────────────────────────────────────────
  let flights = []
  let airports = []
  let _agg = null
  let fileHash = ''
  let dirty = false
  let airportsDirty = false
  let statusActions = []

  let _view = 'dashboard'
  let _activeYear = null
  let _dashDetailId = null
  let _editId = null

  let _airportDetail = null
  let _countryDetail = null
  let _airlineDetail = null
  let _airportBreakdown = null
  let _countryBreakdown = null
  let _airlineBreakdown = null

  let _airportQuery = ''
  let _countryQuery = ''
  let _airlineQuery = ''

  let _pendingDraft = null
  let _pendingLegacy = null

  // ── Status + draft ────────────────────────────────────────────────────────
  function setStatus(message, kind, actions) {
    const el = $('fileStatus')
    if (!el) return
    statusActions = actions || []
    el.className = 'file-status' + (kind ? ` ${kind}` : '') + (message ? '' : ' hidden')
    el.innerHTML = message
      ? `<span class="status-text">${esc(message)}</span>` +
        (statusActions.length
          ? `<span class="status-actions">${statusActions
              .map((action, index) => `<button type="button" data-status-action="${index}">${esc(action.label)}</button>`)
              .join('')}</span>`
          : '')
      : ''
  }

  function updateDirtyUI() {
    document.title = (dirty ? '• ' : '') + '✈ FLY'
    const button = $('saveData')
    if (button) button.classList.toggle('dirty', dirty)
  }

  function persistDraft(source) {
    store.writeDraft({ flights, airports, baseHash: fileHash, dirty, source: source || 'files' })
  }

  function markDirty(message) {
    dirty = true
    persistDraft()
    updateDirtyUI()
    if (message) setStatus(message, 'warn')
  }

  function adoptData(nextFlights, nextAirports, options) {
    const opts = options || {}
    const validated = core.validateData(nextFlights, nextAirports)
    flights = validated.flights
    airports = validated.airports
    dirty = opts.dirty !== false
    airportsDirty = !!opts.airportsChanged
    persistDraft(opts.source || 'files')
    renderAll()
    updateDirtyUI()
    return validated
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  const airportMap = () => new Map(airports.map(a => [normCode(a.iata), a]))

  function matches(haystack, query) {
    if (!query) return true
    return String(haystack || '').toLowerCase().includes(query.toLowerCase())
  }

  function dateOrDash(date) { return date || '—' }

  // ── Stats ─────────────────────────────────────────────────────────────────
  function renderStats() {
    const totals = _agg.totals
    const chips = [
      { value: totals.flights, label: 'Flights', view: 'dashboard' },
      { value: totals.airports, label: 'Airports', view: 'airports' },
      { value: totals.countries, label: 'Countries', view: 'countries' },
      { value: totals.airlines, label: 'Airlines', view: 'airlines' },
      { value: totals.aircraft, label: 'Aircraft', view: '' },

    $('statCards').innerHTML = chips.map(chip => {
      const content = `<strong>${chip.value}</strong><span>${chip.label}</span>`
      return chip.view
        ? `<button type="button" class="stat-chip clickable" data-view="${chip.view}" aria-label="${chip.label}: ${chip.value}">${content}</button>`
        : `<div class="stat-chip">${content}</div>`
    }).join('')
  }

  function renderYearPills() {
    const years = _agg.byYear.map(row => row.year)

    $('yearPills').innerHTML = _agg.byYear.map(row =>

  function flightCard(flight) {
    const map = airportMap()
    const arr = map.get(normCode(flight.arrival)) || {}
    const dep = map.get(normCode(flight.departure)) || {}
    const arrShort = shortAirportName(arr.name)
    const depShort = shortAirportName(dep.name)
    const arrCity = [arrShort, arr.city, arr.country].filter(Boolean).join(', ')
    const locationLine = depShort ? `${depShort} → ${arrCity || flight.arrival}` : (arrCity || '')

    return `<div class="flight-card" data-flight-id="${esc(flight.id)}">
      <div class="fc-route">
        <span>${esc(flight.departure)}</span>

      </div>

        <span><strong>${esc(flight.date)}</strong></span>
        ${flight.airline ? `<span>${esc(flight.airline)}</span>` : ''}
        ${flight.aircraft ? `<span>${esc(flight.aircraft)}</span>` : ''}
      </div>
      ${locationLine ? `<div class="fc-airport">${esc(locationLine)}</div>` : ''}
    </div>`
  }

  function flightDetailCard(flight) {
    const map = airportMap()
    const dep = map.get(normCode(flight.departure)) || {}
    const arr = map.get(normCode(flight.arrival)) || {}
    const full = airport => [airport.name, airport.city, airport.country].filter(Boolean).join(', ') || '—'
    return `<div class="flight-detail">
      <div class="detail-route">${esc(flight.departure)} <span class="fc-arrow">→</span> ${esc(flight.arrival)}</div>

        <div class="detail-item"><span class="detail-label">Date</span><span class="detail-value">${esc(flight.date || '—')}</span></div>
        <div class="detail-item"><span class="detail-label">Airline</span><span class="detail-value">${esc(flight.airline || '—')}</span></div>
        <div class="detail-item"><span class="detail-label">Aircraft</span><span class="detail-value">${esc(flight.aircraft || '—')}</span></div>
        <div class="detail-item"><span class="detail-label">Departure airport</span><span class="detail-value">${esc(full(dep))}</span></div>
        <div class="detail-item"><span class="detail-label">Arrival airport</span><span class="detail-value">${esc(full(arr))}</span></div>

  // ── Dashboard ─────────────────────────────────────────────────────────────
  function renderDashCards() {
    const year = _activeYear
    const cards = year
      ? flights.filter(f => flightYear(f) === year).sort(sortByDateDesc)

    if (_dashDetailId) {

  function renderEntryCards(query) {
    const q = String(query || '').toLowerCase()
    const map = airportMap()
    const rows = flights.filter(flight => {
      if (!q) return true
      const arr = map.get(normCode(flight.arrival)) || {}
      const dep = map.get(normCode(flight.departure)) || {}
      const hay = (JSON.stringify(flight) + ' ' + [dep.city, dep.name, arr.city, arr.name, arr.country].join(' ')).toLowerCase()
      return hay.includes(q)
    }).sort(sortByDateDesc)

    $('entryCards').innerHTML = rows.length
      ? rows.map(flightCard).join('')
      : `<p class="no-flights">${q ? 'No matches.' : 'No flights yet.'}</p>`

  // ── Breakdown cards ───────────────────────────────────────────────────────
  function breakdownCards(rows, mode, key) {
    if (!rows.length) return '<p class="no-flights">No flights recorded.</p>'
    const map = airportMap()
    let html = ''
    let year = null

    for (const flight of rows) {
      const flightDateYear = flightYear(flight)
      if (flightDateYear && flightDateYear !== year) {
        year = flightDateYear
        html += `<div class="breakdown-year">${year}</div>`
      }
      const dep = map.get(normCode(flight.departure)) || {}
      const arr = map.get(normCode(flight.arrival)) || {}
      let badge = ''
      let meta = ''
      let sub = ''

      if (mode === 'airport') {
        const isDeparture = normCode(flight.departure) === key
        badge = `<span class="dir-badge ${isDeparture ? 'dep' : 'arr'}">${isDeparture ? 'Out' : 'In'}</span>`
        const other = isDeparture ? arr : dep
        sub = [isDeparture ? flight.arrival : flight.departure, shortAirportName(other.name), other.city, other.country].filter(Boolean).join(' · ')
        meta = [flight.airline, flight.aircraft].filter(Boolean).join(' · ') || '—'
      } else if (mode === 'country') {
        sub = [flight.arrival, shortAirportName(arr.name), arr.city].filter(Boolean).join(' · ')
        meta = [flight.airline, flight.aircraft].filter(Boolean).join(' · ') || '—'
      } else {
        sub = [arr.city, arr.country].filter(Boolean).join(', ') || '—'
        meta = flight.aircraft || '—'
      }

      html += `<button type="button" class="breakdown-card" data-breakdown-flight="${esc(flight.id)}">
        <span class="bc-top"><span class="bc-date">${esc(dateOrDash(flight.date))}</span>${badge}</span>
        <span class="bc-route">${esc(flight.departure)} <span class="fc-arrow">→</span> ${esc(flight.arrival)}</span>
        <span class="bc-meta">${esc(meta)}</span>
        <span class="bc-sub">${esc(sub)}</span>
      </button>`
    }
    return html
  }

  // ── Airport lookup ────────────────────────────────────────────────────────
  async function ensureAirport(iata) {
    if (!iata || airports.some(airport => normCode(airport.iata) === iata)) return
    const found = await lookupWikidata(iata)
    if (found) {
      airports.push(found)
      airportsDirty = true
      return
    }
    const country = prompt(`No data for ${iata}. Enter country (or blank to skip):`)
    if (!country) {
      airports.push({ iata, name: '', city: '', country: '' })
      airportsDirty = true
      return
    }
    airports.push({
      iata,
      name: normText(prompt(`Airport name for ${iata}?`, '') || ''),
      city: normText(prompt(`City for ${iata}?`, '') || ''),
      country: normText(country),
    })
    airportsDirty = true
  }

  async function lookupWikidata(iata) {
    try {
      const query = `SELECT ?airport ?airportLabel ?cityLabel ?countryLabel WHERE {
        ?airport wdt:P238 "${iata}".
        OPTIONAL { ?airport wdt:P931 ?city. }
        OPTIONAL { ?airport wdt:P17 ?country. }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      } LIMIT 1`
      const response = await fetch(
        `https://query.wikidata.org/sparql?format=json&query=${encodeURIComponent(query)}`,
        { headers: { Accept: 'application/sparql-results+json' } }
      )
      if (!response.ok) return null
      const data = await response.json()
      const result = data.results?.bindings?.[0]
      if (!result?.countryLabel?.value) return null
      return {
        iata,
        name: normText(result.airportLabel?.value),
        city: normText(result.cityLabel?.value),
        country: normText(result.countryLabel.value),
      }
    } catch {
      return null
    }
  }

    document.querySelectorAll('.panel').forEach(panel => panel.classList.toggle('active', panel.id === name))

  // ── Save / import ─────────────────────────────────────────────────────────
  async function saveToFile() {
    // One file holds both shapes: flights first, then airports.
    const dataText = core.serializeData(flights, airports)
    const nextHash = store.hash(dataText)

    if (store.supportsFolder()) {
      let handle = null
      try { handle = await store.getSavedFolder() } catch { handle = null }
      if (handle) {
        try {
          if (!(await store.ensurePermission(handle))) throw new Error('Folder permission was not granted')
          await store.saveToFolder(handle, { [store.FILES.data]: dataText })
          fileHash = nextHash
          dirty = false
          store.writeDraft({ flights, airports, baseHash: fileHash, dirty: false, source: 'files' })
          updateDirtyUI()
          setStatus(`Saved to the linked data folder · ${flights.length} flights`, 'ok')
          return
        } catch (error) {
          console.warn('Folder save failed; falling back to download:', error)
        }
      }
    }

    store.download(store.FILES.data, dataText)
    fileHash = nextHash
    dirty = false
    store.writeDraft({ flights, airports, baseHash: fileHash, dirty: false, source: 'files' })
    updateDirtyUI()
    setStatus(`Downloaded ${store.FILES.data} — replace it in ${store.DATA_DIR}`, 'warn')
  }

  async function handleImport(file) {
    let text
    try {
      text = await file.text()
    } catch (error) {
      setStatus(`Could not read ${file.name}: ${error.message}`, 'error')
      return
    }

    const parsed = core.parseImport(text)
    if (!parsed.flights && !parsed.airports) {
      const detail = parsed.errors.length ? parsed.errors[0].message : 'no flight or airport records found'
      setStatus(`Import failed: ${detail}`, 'error')
      return
    }

    const parts = []
    if (parsed.flights) parts.push(`flights ${flights.length} → ${parsed.flights.length}`)
    if (parsed.airports) parts.push(`airports ${airports.length} → ${parsed.airports.length}`)
    const target = [parsed.flights ? 'flights' : null, parsed.airports ? 'airports' : null].filter(Boolean).join(' and ')
    if (!confirm(`Replace ${target}?\n\n${parts.join(' · ')}\n\nA one-step undo is kept.`)) return

    const nextFlights = parsed.flights && parsed.flights.length ? parsed.flights : flights
    const nextAirports = parsed.airports && parsed.airports.length ? parsed.airports : airports

    store.saveUndo({ flights, airports, baseHash: fileHash })
    const validated = adoptData(
      nextFlights,
      nextAirports,
      { dirty: true, airportsChanged: true, source: 'import' }
    )
    const warnings = (parsed.errors || []).length + validated.warnings.length
    const summary = parsed.airports || !airports.length
      ? `Imported ${flights.length} flights and ${airports.length} airports`
      : `Imported ${flights.length} flights · kept ${airports.length} airport records`
    setStatus(
      `${summary}${warnings ? ` · ${warnings} warning(s)` : ''}`,
      warnings ? 'warn' : 'ok',
      [{ label: 'Undo', fn: undoImport }]
    )
  }

  function undoImport() {
    const undo = store.readUndo()
    if (!undo) {
      setStatus('Nothing to undo', 'warn')
      return
    }
    store.clearUndo()
    adoptData(undo.flights, undo.airports, { dirty: true, airportsChanged: true, source: 'import' })
    setStatus('Import undone — save to update data/', 'warn')
  }

  // ── Events ────────────────────────────────────────────────────────────────
  function wireEvents() {
    document.querySelectorAll('.bnav-btn').forEach(button =>
      button.addEventListener('click', () => switchTab(button.dataset.tab))
    )

    // All navigation inside the aggregate/detail views
    document.addEventListener('click', event => {
      const viewButton = event.target.closest('[data-view]')
      if (viewButton) { switchTab(viewButton.dataset.view); return }

      const yearPill = event.target.closest('.year-pill')
      if (yearPill) {
        _activeYear = parseInt(yearPill.dataset.year, 10)
        _dashDetailId = null
        renderYearPills()
        renderDashCards()
        return
      }

      if (event.target.closest('#dashBackBtn')) {
        _dashDetailId = null
        renderDashCards()
        return
      }

      const dashCard = event.target.closest('#dashCards [data-flight-id]')
      if (dashCard && !_dashDetailId) {
        _dashDetailId = dashCard.dataset.flightId
        renderDashCards()
        return
      }

      const entryCard = event.target.closest('#entryCards [data-flight-id]')
      if (entryCard) { openSheet(entryCard.dataset.flightId); return }

      const airportCardEl = event.target.closest('[data-airport]')
      if (airportCardEl) {
        _airportDetail = airportCardEl.dataset.airport
        _airportBreakdown = null
        renderAll()
        return
      }

      const countryCardEl = event.target.closest('[data-country]')
      if (countryCardEl) {
        _countryDetail = countryCardEl.dataset.country
        _countryBreakdown = null
        renderAll()
        return
      }

      const airlineCardEl = event.target.closest('[data-airline]')
      if (airlineCardEl) {
        _airlineDetail = airlineCardEl.dataset.airline
        _airlineBreakdown = null
        renderAll()
        return
      }

      const jumpAirport = event.target.closest('[data-jump-airport]')
      if (jumpAirport) {
        _airportDetail = jumpAirport.dataset.jumpAirport
        _airportBreakdown = null
        switchTab('airports')
        renderAll()
        return
      }

      const breakdownCard = event.target.closest('[data-breakdown-flight]')
      if (breakdownCard) {
        const id = breakdownCard.dataset.breakdownFlight
        if (event.target.closest('#airportList')) _airportBreakdown = id
        else if (event.target.closest('#countryList')) _countryBreakdown = id
        else if (event.target.closest('#airlineList')) _airlineBreakdown = id
        renderAll()
        return
      }

      if (event.target.closest('[data-breakdown-back]')) {
        if (event.target.closest('#airportList')) _airportBreakdown = null
        if (event.target.closest('#countryList')) _countryBreakdown = null
        if (event.target.closest('#airlineList')) _airlineBreakdown = null
        renderAll()
        return
      }

      const backView = event.target.closest('[data-back-view]')
      if (backView) {
        if (backView.dataset.backView === 'airports') { _airportDetail = null; _airportBreakdown = null }
        if (backView.dataset.backView === 'countries') { _countryDetail = null; _countryBreakdown = null }
        if (backView.dataset.backView === 'airlines') { _airlineDetail = null; _airlineBreakdown = null }
        renderAll()
        return
      }
    })

    // FAB
    $('fab').addEventListener('click', () => openSheet())

    // Sheet close
    $('sheetBackdrop').addEventListener('click', closeSheet)
    $('cancelSheet').addEventListener('click', closeSheet)

    // Arrival city hint
    $('sArr').addEventListener('input', updateCityHint)

    $('flightForm').addEventListener('focusin', event => {
      if (event.target.matches('input')) {
        setTimeout(() => event.target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80)
      }
    })

    // Delete
    $('deleteFlightBtn').addEventListener('click', () => {
      const id = $('flightId').value
      if (!id || !confirm('Delete this flight?')) return
      closeSheet()
      flights = flights.filter(flight => flight.id !== id)
      markDirty('Flight deleted — save to update data/')
      renderAll()
    })

    // Form submit
    $('flightForm').addEventListener('submit', async event => {
      event.preventDefault()
      const dep = normCode($('sDep').value)
      const arr = normCode($('sArr').value)
      await ensureAirport(dep)
      await ensureAirport(arr)
      const id = $('flightId').value || core.makeId()
      const flight = {
        id,
        date: $('sDate').value,
        departure: dep,
        arrival: arr,
        airline: normText($('sAirline').value),
        aircraft: normText($('sAircraft').value),
      }
      const index = flights.findIndex(row => row.id === id)
      if (index >= 0) flights[index] = flight
      else flights.push(flight)
      markDirty(`Unsaved changes · ${flights.length} flights — save to update data/`)
      closeSheet()
      renderAll()
    })

    // Search
    $('entrySearch').addEventListener('input', event => renderEntryCards(event.target.value))
    $('airportSearch').addEventListener('input', event => {
      _airportQuery = event.target.value
      renderAirportView()
    })
    $('countrySearch').addEventListener('input', event => {
      _countryQuery = event.target.value
      renderCountryView()
    })
    $('airlineSearch').addEventListener('input', event => {
      _airlineQuery = event.target.value
      renderAirlineView()
    })

    // Status actions
    $('fileStatus').addEventListener('click', event => {
      const button = event.target.closest('[data-status-action]')
      if (!button) return
      const action = statusActions[Number(button.dataset.statusAction)]
      if (action && typeof action.fn === 'function') action.fn()
    })

    // Save / export / import
    $('saveData').addEventListener('click', saveToFile)

    $('exportJson').addEventListener('click', () => {
      const payload = JSON.stringify({ flights, airports }, null, 2)
      store.download('flights-backup.json', payload + '\n', 'application/json;charset=utf-8')
      setStatus('Downloaded flights-backup.json', 'ok')
    })

    $('importJson').addEventListener('change', async event => {
      const file = event.target.files[0]
      event.target.value = ''
      if (!file) return
      await handleImport(file)
    })

    window.addEventListener('beforeunload', event => {
      if (!dirty) return
      event.preventDefault()
      event.returnValue = ''
    })
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  function updateSheetHeight() {
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight
    const nav = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-h')) || 64
    document.documentElement.style.setProperty('--sheet-max-h', `${Math.max(260, Math.round(vh - nav - 12))}px`)
  }

  async function boot() {
    wireEvents()
    updateSheetHeight()

    const loaded = await store.loadFiles()
    const draft = store.readDraft()
    const legacy = store.migrateV1()
    let usedDraft = false
    let usedLegacy = false
    let warnings = []

    // A missing data file is a normal first run, not an error.
    if (loaded.anyRead) {
      const validated = core.validateData(loaded.flights, loaded.airports)
      flights = validated.flights
      airports = validated.airports
      warnings = validated.warnings
      fileHash = store.hash(core.serializeData(flights, airports))

      if (draft && draft.dirty) {
        if (draft.baseHash === fileHash) {
          adoptData(draft.flights, draft.airports, { dirty: true, airportsChanged: true, source: 'draft' })
          usedDraft = true
        } else {
          _pendingDraft = draft
        }
      } else if (!draft && legacy) {
        const legacyValidated = core.validateData(legacy.flights, legacy.airports)
        const legacyHash = store.hash(
          core.serializeData(legacyValidated.flights, legacyValidated.airports)
        )
        if (legacyHash === fileHash) store.clearLegacy()
        else _pendingLegacy = legacy
      }
    } else if (draft) {
      adoptData(draft.flights, draft.airports, { dirty: !!draft.dirty, airportsChanged: true, source: 'draft' })
      usedDraft = true
    } else if (legacy) {
      adoptData(legacy.flights, legacy.airports, { dirty: true, airportsChanged: true, source: 'migration' })
      store.clearLegacy()
      usedLegacy = true
    } else {
      const validated = core.validateData(loaded.flights, loaded.airports)
      flights = validated.flights
      airports = validated.airports
      warnings = validated.warnings
      fileHash = store.hash(core.serializeData(flights, airports))
    }

    if (!usedDraft && !usedLegacy) renderAll()
    updateDirtyUI()

    if (_pendingDraft) {
      setStatus(
        `Local draft found (${_pendingDraft.flights.length} flights) that does not match data/ — restore it or discard it`,
        'warn',
        [
          {
            label: 'Restore',
            fn: () => {
              adoptData(_pendingDraft.flights, _pendingDraft.airports, { dirty: true, airportsChanged: true, source: 'draft' })
              _pendingDraft = null
              setStatus('Draft restored — save to update data/', 'warn')
            },
          },
          {
            label: 'Discard',
            fn: () => {
              store.clearDraft()
              _pendingDraft = null
              setStatus('Draft discarded — using the data files', 'ok')
            },
          },
        ]
      )
    } else if (_pendingLegacy) {
      setStatus(
        `Old local cache found (${_pendingLegacy.flights.length} flights) that differs from data/`,
        'warn',
        [
          {
            label: 'Use cache',
            fn: () => {
              adoptData(_pendingLegacy.flights, _pendingLegacy.airports, { dirty: true, airportsChanged: true, source: 'migration' })
              store.clearLegacy()
              _pendingLegacy = null
              setStatus('Local cache imported — save to update data/', 'warn')
            },
          },
          {
            label: 'Ignore',
            fn: () => {
              store.clearLegacy()
              _pendingLegacy = null
              setStatus('Old local cache ignored', 'ok')
            },
          },
        ]
      )
    } else if (loaded.errors.length) {
      setStatus(`Loaded ${flights.length} flights · ${loaded.errors[0]}`, 'warn')
      console.warn('Data file problems:', loaded.errors)
    } else if (warnings.length) {
      setStatus(`Loaded ${flights.length} flights · ${warnings.length} warning(s): ${warnings[0].message}`, 'warn')
      console.warn('Data warnings:', warnings)
    } else if (loaded.anyRead) {
      setStatus(`Loaded ${store.DATA_DIR}${store.FILES.data} · ${flights.length} flights`, 'ok')
    }
  }

  updateSheetHeight()
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateSheetHeight)
    window.visualViewport.addEventListener('scroll', updateSheetHeight)
  }

  boot()
  </script>
</body>
</html>
